  deterministic: true
  max_steps: 1250
  warmup_steps: 1000
  min_lr_ratio: 0.1
  max_grad_norm: 1.0
  num_workers: 1
  log_every_steps: 1
  save_every_steps: 20001
  valid_every_steps: 0
  valid_batch_size_per_rank: 1
  valid_max_batches_per_rank: 0
  valid_selection_metric: null
  valid_patience: 0
  valid_min_delta: 0.0001
  output_dir: ${OQM_OUTPUT_ROOT:-./outputs}/refiner/train
  amp: false
  amp_dtype: bfloat16
  valid_posterior_mode: mean
  optimizer_policy:
    muon_implementation: oqm_explicit_newton_schulz_v1
    non_matrix_rule: momentum_sgd
    silent_adam_fallback: false
  vae_posterior_mode: mean
  expected_source_posterior_mode: sample
  batch_size_per_rank: 1
  segment_seconds: 1.28
  generator_steps_per_discriminator: 4
  generator_optimizer:
    name: adamw
    lr: 0.00015
    betas:
    - 0.9
    - 0.95
    weight_decay: 0.01
  waveform_discriminator_optimizer:
    name: adamw
    lr: 1.0e-06
    betas:
    - 0.9
    - 0.95
    weight_decay: 0.01
  spectral_discriminator_optimizer:
    name: adamw
    lr: 1.0e-05
    betas:
    - 0.9
    - 0.95
    weight_decay: 0.01
  expected_world_size: 64
  expected_global_batch_size: 64
  require_full_valid_coverage: true
  prefetch_factor: 2
  require_empty_output_dir: true
  require_explicit_stop_at_step: true
  quality_gate_steps:
  - 1250
  checkpoint_steps:
  - 1250
data:
