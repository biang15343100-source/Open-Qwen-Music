  refiner_width: 4
  refiner_depth: 1
  discriminator_base_channels: 2
  discriminator_depth: 2
  stft_scales:
  - - 256
    - 64
    - 256
stage: 3
component: refiner
loss_weights:
  stft: 0.5
  if_gd: 0.1
  kl: 0.0
  waveform_adversarial: 0.175
  waveform_feature_matching: 20.0
  spectral_adversarial: 0.5
