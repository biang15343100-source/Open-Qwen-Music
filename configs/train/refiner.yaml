format_version: oqm.render.config.v1
contract:
  sample_rate: 48000
  channels: 2
  latent_frame_hz: 25
  latent_dim: 128
  segment_seconds: 1.28
  segment_samples: 61440
  segment_latent_frames: 32
stft:
  n_fft: 960
  win_length: 960
  hop_length: 480
  window: hann_periodic
  center: false
  explicit_left_padding: 240
  explicit_right_padding: true
  keep_dc: true
  drop_nyquist: true
  bins: 480
  analysis_dtype: float32
  revision: open-qwen-music-stft-v1
model:
  spec_vae:
    latent_dim: 128
    posterior_variance_epsilon: 1.0e-06
    encoder_base_channels: 64
    decoder_base_channels: 128
    weight_norm: true
    revision: open-qwen-music-acoustic-vae-v1
  refiner:
    width: 256
    intermediate_dim: 1024
    depth: 12
    kernel_size: 7
    layer_scale_init_value: null
    layer_norm_eps: 1.0e-05
    block_layer_norm_eps: 1.0e-06
    low_mid_hz: 1500.0
    mid_high_hz: 4000.0
    magnitude_epsilon: 1.0e-08
    max_log_magnitude_residual: 4.0
    revision: open-qwen-music-refiner-v1
loss:
  k_weighting: true
  adaptive_log_magnitude: true
  sample_rms_normalization: true
  sample_rms_floor: 0.0001
  sample_equal_reduction: true
  stft_consistency_weight: 0.0
  refiner_reconstruction_domain: raw
  mr_ccpc_weight: 0.0
  waveform_peak_envelope_weight: 0.0
