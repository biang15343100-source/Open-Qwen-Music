  split: train
  segment_samples: 61440
  random_crop: true
  verify_audio_sha256: true
  allow_source_audio: true
  release_ready: null
  valid_manifest: ${OQM_DATA_ROOT:-./data}/refiner/valid.jsonl
  audio_integrity_mode: node_once
  batch_plan: null
  batch_plan_sha256: null
  require_exact_exposure: false
  allow_prefix_exposure: false
