  si_sdr_no_regression_weight: 0.0
  si_sdr_no_regression_margin_db: 0.0
  mr_stft_weight: 0.1
  mel_weight: 0.0
  waveform_l1_weight: 0.0
  spectrum_complex: 1.0
  spectrum_linear: 0.5
  spectrum_log1p: 0.5
  lr_ms: 0.1
  ccpc: 0.1
  absolute_ipd: 0.1
  spectral_pan: 0.1
  phase_weighting: binary
  kl_start_dim: 1
  kl_reduction: channel_sum_mean
