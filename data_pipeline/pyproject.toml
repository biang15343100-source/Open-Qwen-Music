[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-qwen-music-data-pipeline"
version = "0.1.0"
description = "Open-Qwen-Music corpus preprocessing and model-based annotation pipelines"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11",
  "PyYAML>=6.0",
  "soundfile>=0.12",
  "pyarrow>=15.0",
  "pydantic>=2.6",
  "lingua-language-detector>=2.1.1,<3",
]

[project.optional-dependencies]
preprocess = ["zstandard>=0.22"]
speed = ["isal>=1.6"]
query = ["duckdb>=0.10"]
gpu = [
  "torch>=2.4",
  "torchaudio>=2.4",
  "transformers>=4.57",
  "accelerate>=1.2",
  "safetensors>=0.6",
  "huggingface-hub>=0.30",
  "qwen-asr>=0.0.6",
  "qwen-omni-utils>=0.0.9",
  "librosa>=0.11",
  "numba>=0.61",
  "soxr>=1.0",
  "muq>=0.1",
  "ema-pytorch>=0.8",
  "omegaconf>=2.3",
  "loguru>=0.7",
  "einops>=0.8",
  "nnAudio>=0.3",
  "x-transformers>=2.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[project.scripts]
oqm-preprocess = "oqm_preprocess.cli:main"
oqm-annotate = "oqm_annotate.cli:main"
oqm-adapt-renderer-semantics = "oqm_preprocess.renderer_semantic_adapter:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["oqm_preprocess*", "oqm_annotate*"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:oqm_preprocess.*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"src/oqm_preprocess/stages/enrich.py" = ["B023"]
